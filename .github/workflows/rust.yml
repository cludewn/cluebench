name: Desktop and Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy
      - name: Report the active Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/desktop/.node-version
          package-manager-cache: false
      - name: Install the pinned pnpm version
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - name: Install frontend dependencies
        run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check frontend types
        if: runner.os == 'Linux'
        run: pnpm -C apps/desktop typecheck
      - name: Test the frontend states and bridge
        if: runner.os == 'Linux'
        run: pnpm -C apps/desktop test
      - name: Build assets for Rust workspace checks
        if: runner.os == 'Linux'
        run: pnpm -C apps/desktop build
      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the Cargo workspace
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked
      - name: Test the independent Rust Core
        if: runner.os == 'Linux'
        run: cargo test -p cluebench-core --locked
      - name: Build the native desktop application without installers
        run: pnpm -C apps/desktop tauri build --no-bundle --ci -- --locked
