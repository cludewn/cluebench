
name: Feature request
description: Suggest a feature or improvement for Cluebench.

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.

        We recommend a Conventional Commits-style title, normally with a
        scope, for example `feat(core): support additional constraint types`.
        If you cannot identify an appropriate scope, you may omit it.

        Describe the problem you want to solve. You do not need
        to know how the feature should be implemented.

        Do not include real passwords, sensitive clues, personal
        information, or confidential project files.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you experiencing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe a possible solution, if you have one.
    validations:
      required: false

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What would you like to accomplish with this feature?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds you have tried.
    validations:
      required: false
