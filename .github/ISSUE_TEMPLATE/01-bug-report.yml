
name: Bug report
description: Report a bug in Cluebench.

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        We recommend a Conventional Commits-style title, normally with a
        scope, for example `fix(ui): correct constraint editor behavior`.
        If you cannot identify an appropriate scope, you may omit it.

        Do not report security vulnerabilities here. Follow the
        instructions in SECURITY.md to report them privately.

        Do not include real passwords, sensitive clues, personal
        information, or confidential project files.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide reproduction steps, if known.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Cluebench version, OS, and other relevant details.
    validations:
      required: false
