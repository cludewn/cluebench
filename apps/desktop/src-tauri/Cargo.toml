[package]
name = "cluebench-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cluebench desktop shell and local Core adapter"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
age = { version = "=0.12.1", default-features = false }
cluebench-core = { path = "../../../crates/cluebench-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-dialog = "=2.8.4"
uuid = { version = "=1.29.0", features = ["v4"] }
zeroize = "=1.9.1"

[dev-dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["test"] }
tempfile = "=3.23.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_LibraryLoader"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
